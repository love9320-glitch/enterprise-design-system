name: Deploy Design System to GitHub Pages

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: design-system/package-lock.json

      - name: Install & Build
        working-directory: design-system
        run: |
          npm ci
          npm run build

      - uses: actions/configure-pages@v4
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: design-system/dist

      - uses: actions/deploy-pages@v4
        id: deployment

  # 배포 후 스모크 (2026-08-13 운영안 ⓒ) — 실제 배포 URL을 Chromium으로 열어
  # 버전 배지·핵심 데모 페이지 렌더·콘솔 에러·리소스 실패를 검사한다.
  # 실패해도 배포는 이미 완료된 상태 — 이 잡의 실패는 "배포본 이상" 알림 역할.
  smoke:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # playwright는 스모크 전용 — 패키지 의존성에 넣지 않고 잡 안에서만 설치
      - name: Install Playwright
        working-directory: design-system
        run: |
          npm i --no-save playwright
          npx playwright install --with-deps chromium

      - name: Pages smoke test
        working-directory: design-system
        run: node scripts/pages-smoke.mjs "${{ needs.deploy.outputs.page_url }}"
